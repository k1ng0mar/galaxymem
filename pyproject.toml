[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "galaxymem"
version = "0.1.0"
description = "Entity-scoped memory with four-network epistemic split, decay, and autonomous reflection. LanceDB-backed."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "GalaxyMem Contributors"},
]
keywords = ["memory", "ai", "agent", "lancedb", "epistemic", "entity-scoped"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "lancedb>=0.6.0",
    "fastembed>=0.3.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
include = ["galaxymem*"]

[tool.pytest.ini_options]
testpaths = ["galaxymem/tests"]
python_files = ["test_*.py"]
