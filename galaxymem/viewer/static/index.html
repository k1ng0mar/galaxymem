<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Galaxy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Surface uncaught script errors visibly instead of silently failing -->
  <script>
    window.addEventListener('error', function(e) {
      var d = document.getElementById('detail-content');
      if (d) d.innerHTML = '<div style="color:#c4654a;padding:20px;font-family:monospace">SCRIPT ERROR: ' + (e.message || e.error) + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : '') + '</div>';
    }, true);
  </script>
  <div class="app-container">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1>Memory Galaxy</h1>
        <div class="subtitle">GALAXYMEM // VIEWER</div>
      </div>

      <div class="nav-section">
        <div class="nav-section-title">VIEW</div>
        <div class="nav-item active" data-view="brain" id="nav-brain">
          <span class="icon">◉</span> Brain Map
        </div>
        <div class="nav-item" data-view="tree" id="nav-tree">
          <span class="icon">⊞</span> Tree
        </div>
        <div class="nav-item" data-view="stats" id="nav-stats">
          <span class="icon">≡</span> Stats
        </div>
      </div>

      <div class="nav-section">
        <div class="nav-section-title">MODE</div>
        <div class="nav-item active" id="mode-current">
          <span class="icon">●</span> Current
        </div>
        <div class="nav-item" id="mode-timetravel">
          <span class="icon">◐</span> Time Travel
        </div>
      </div>

      <div class="nav-section">
        <div class="nav-filters">
          <h3>Network Filter</h3>
          <span class="filter-chip active" data-network="">All</span>
          <span class="filter-chip" data-network="world"><span class="filter-dot" style="background:#7c8cf8"></span>World</span>
          <span class="filter-chip" data-network="experience"><span class="filter-dot" style="background:#5fb89e"></span>Experience</span>
          <span class="filter-chip" data-network="opinion"><span class="filter-dot" style="background:#c4a27a"></span>Opinion</span>
          <span class="filter-chip" data-network="observation"><span class="filter-dot" style="background:#9d7cd8"></span>Observation</span>
        </div>
      </div>
    </div>

    <!-- Main content -->
    <div class="main-content" id="main-content">
      <!-- Search bar (always visible) -->
      <div class="search-bar">
        <div class="search-box">
          <span class="search-icon">⌕</span>
          <input type="text" id="search-input" placeholder="Search memories..." autocomplete="off">
        </div>
      </div>

      <!-- Brain map view -->
      <div id="view-brain" class="view-section active">
        <div class="graph-container" id="graph-container">
          <canvas class="graph-canvas" id="galaxy-canvas"></canvas>
          <div class="graph-tooltip" id="graph-tooltip"></div>

          <div class="graph-info" id="graph-info">
            <span id="node-count">0</span> nodes · <span id="fps-display">--</span> fps
          </div>

          <div class="graph-controls">
            <div class="graph-btn" id="zoom-in-btn" title="Zoom in">+</div>
            <div class="graph-btn" id="zoom-out-btn" title="Zoom out">−</div>
          </div>

          <div class="graph-legend">
            <h4>Networks</h4>
            <div class="legend-row"><span class="filter-dot" style="background:#7c8cf8"></span> World</div>
            <div class="legend-row"><span class="filter-dot" style="background:#5fb89e"></span> Experience</div>
            <div class="legend-row"><span class="filter-dot" style="background:#c4a27a"></span> Opinion</div>
            <div class="legend-row"><span class="filter-dot" style="background:#9d7cd8"></span> Observation</div>
            <h4 style="margin-top:8px">Entities</h4>
            <div class="legend-row"><span class="filter-dot dashed" style="background:#c4a27a"></span> Person (dashed)</div>
            <div class="legend-row"><span class="filter-dot" style="background:#7c8cf8"></span> Project (solid)</div>
            <div class="legend-row"><span class="filter-dot" style="background:#6bc5d8"></span> Self</div>
          </div>
        </div>
      </div>

      <!-- Tree view -->
      <div id="view-tree" class="view-section">
        <div id="tree-container" class="tree-container"></div>
      </div>

      <!-- Stats view -->
      <div id="view-stats" class="view-section">
        <div id="stats-container"></div>
      </div>
    </div>

    <!-- Detail panel -->
    <div class="detail-panel" id="detail-panel">
      <div class="detail-close" id="detail-close">✕</div>
      <div id="detail-content"></div>
    </div>
  </div>

  <script src="/static/galaxy.js?v=20260712fix"></script>
  <script src="/static/tree.js?v=20260712diag"></script>
  <script src="/static/app-v2.js?v=20260712fix"></script>
</body>
</html>
